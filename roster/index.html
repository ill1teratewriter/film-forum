<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>The Illiterate Writer&rsquo;s Film Forum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --ink:#0c0a12; --ink-2:#141020; --line:rgba(255,255,255,.10); --line-2:rgba(255,255,255,.18);
  --text:#efe9f5; --dim:#a99fbd; --faint:#7a7090;
  --hb:#ff5c7a; --sb:#ff9d2e; --ok:#8fd9a8;
  --display:'Oswald','Arial Narrow',Arial,sans-serif;
  --serif:'Playfair Display',Georgia,serif;
  --sans:'Inter',-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:16px;
  line-height:1.6;padding-inline:20px;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 10% -10%,rgba(255,92,122,.13),transparent 62%),
             radial-gradient(800px 460px at 94% 2%,rgba(255,157,46,.09),transparent 62%)}
.wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding-block:40px 90px}

.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding-block:16px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-size:12.5px;letter-spacing:.3em;text-transform:uppercase;
  color:var(--dim);text-decoration:none}
.brand:hover{color:var(--text)}
.priv{font-family:var(--display);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--hb);border:1px solid rgba(255,92,122,.5);border-radius:999px;padding:4px 11px}

h1{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;
  line-height:.92;font-size:clamp(38px,8vw,64px);margin:32px 0 0;
  background:linear-gradient(175deg,#fff 8%,#cfc3e6 55%,#8d7fae 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.stand{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--dim);
  margin:16px 0 0;max-width:60ch}

.keybox{margin-top:30px;border:1px solid var(--line-2);border-radius:14px;padding:20px;
  background:rgba(255,255,255,.02)}
.keybox label{display:block;font-family:var(--display);font-size:10px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.keybox .row{display:flex;gap:10px;flex-wrap:wrap}
input[type=password],input[type=text]{flex:1 1 220px;min-width:0;font:inherit;font-size:15px;
  color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--line-2);
  border-radius:10px;padding:12px 14px}
input:focus{outline:2px solid var(--sb);outline-offset:2px}
button{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  border-radius:999px;padding:12px 22px;cursor:pointer;font-weight:600;
  color:var(--ink);background:var(--text);border:1px solid var(--text)}
button:hover{background:#fff}
button.quiet{background:none;color:var(--dim);border:1px solid var(--line-2);font-weight:400}
button.quiet:hover{color:var(--text);border-color:var(--text)}
.err{color:var(--hb);font-size:14px;margin:12px 0 0}

.ch{margin-top:34px;border-top:1px solid var(--line);padding-top:22px}
.chh{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.chn{font-family:var(--display);font-size:32px;font-weight:700;color:var(--faint);line-height:1}
.cht{font-family:var(--display);font-size:22px;font-weight:600;text-transform:uppercase;
  letter-spacing:.01em}
.state{font-family:var(--display);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  border-radius:999px;padding:4px 11px;border:1px solid var(--line-2);color:var(--dim)}
.state.open{color:var(--ink);background:var(--sb);border-color:var(--sb);font-weight:600}
.state.closed{color:var(--ok);border-color:rgba(143,217,168,.5)}

.bars{display:flex;gap:10px;margin-top:16px;align-items:center;flex-wrap:wrap}
.bar{flex:1 1 200px;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;
  display:flex;min-width:160px}
.bar i{display:block;height:100%}
.bar .h{background:var(--hb)}
.bar .s{background:var(--sb)}
.count{font-family:var(--display);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap}
.count b{color:var(--text);font-weight:600}
.broke{font-size:13.5px;color:var(--sb);margin-top:10px;font-style:italic;font-family:var(--serif)}
/* a row the count has already set aside */
tr.gone td{opacity:.42}
tr.gone .road{border-style:dashed}
.gonetag{font-family:var(--display);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);border:1px dashed var(--line-2);border-radius:999px;padding:2px 8px;
  margin-left:9px;vertical-align:1px}
/* a row set aside by hand — dimmed, never hidden, one tap from coming back */
tr.hush td{opacity:.42}
tr.hush .road{border-style:dashed}
tr.hush td.act{opacity:1}
.hushtag{font-family:var(--display);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--faint);border:1px dashed var(--line-2);border-radius:999px;padding:2px 8px;
  margin-left:9px;vertical-align:1px}
.againtag{font-family:var(--display);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink);background:var(--sb);border:1px solid var(--sb);border-radius:999px;
  padding:2px 8px;margin-left:9px;vertical-align:1px;font-weight:600}
button.hushbtn{font-size:9.5px;letter-spacing:.16em;padding:6px 13px;background:none;
  color:var(--faint);border:1px solid var(--line);font-weight:400}
button.hushbtn:hover{color:var(--hb);border-color:rgba(255,92,122,.55);background:none}
button.hushbtn.back{color:var(--ok);border-color:rgba(143,217,168,.45)}
button.hushbtn.back:hover{color:var(--ok);border-color:var(--ok)}
button.hushbtn[disabled]{opacity:.4;cursor:default}
td.act{text-align:right;white-space:nowrap;padding-left:14px;width:1%}

/* ---------- ending a ballot early -----------------------------------------
   Deliberately the loudest thing in the room, and deliberately two taps. */
.call{margin-top:20px;border:1px solid rgba(255,92,122,.3);border-radius:13px;padding:15px 17px;
  background:rgba(255,92,122,.05)}
.call.done{border-color:rgba(143,217,168,.32);background:rgba(143,217,168,.05)}
.callnote{margin:0 0 12px;font-size:14px;color:var(--dim);line-height:1.65}
.callnote b{color:var(--text);font-weight:600}
.callnote .big{display:block;font-family:var(--serif);font-style:italic;font-size:17px;
  color:var(--text);margin-bottom:8px}
button.callbtn{font-size:10px;letter-spacing:.2em;padding:10px 18px;background:none;
  color:var(--hb);border:1px solid rgba(255,92,122,.55);font-weight:600}
button.callbtn:hover{background:rgba(255,92,122,.13);color:#fff;border-color:var(--hb)}
button.callbtn.yes{background:var(--hb);border-color:var(--hb);color:#12060a}
button.callbtn.yes:hover{background:#ff7590;color:#12060a}
button.callbtn.no{color:var(--dim);border-color:var(--line-2)}
button.callbtn.no:hover{background:none;color:var(--text);border-color:var(--text)}
button.callbtn.back{color:var(--ok);border-color:rgba(143,217,168,.45)}
button.callbtn.back:hover{background:rgba(143,217,168,.12);color:var(--ok);border-color:var(--ok)}
button.callbtn[disabled]{opacity:.38;cursor:default;background:none;color:var(--faint);
  border-color:var(--line)}
.ask[hidden],.offer[hidden]{display:none}
.ask{border-top:1px solid rgba(255,92,122,.22);margin-top:14px;padding-top:14px}
.warn{font-family:var(--display);font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--hb);display:block;margin-bottom:9px}
.btns{display:flex;gap:9px;flex-wrap:wrap}

table{width:100%;border-collapse:collapse;margin-top:16px;font-size:15px}
th{text-align:left;font-family:var(--display);font-size:9.5px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 0 8px;
  border-bottom:1px solid var(--line)}
td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.nm{text-transform:capitalize}
/* the hour, under the name. Rows run newest-first, so when one name shows up
   twice the older of the two is always the lower of the two. */
.when{display:block;text-transform:none;font-family:var(--display);font-size:10px;
  letter-spacing:.14em;color:var(--faint);margin-top:3px;font-weight:300}
.chairtag{font-family:var(--display);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--sb);border:1px solid rgba(255,157,46,.5);border-radius:999px;padding:2px 8px;
  margin-left:9px;vertical-align:1px}
.road{font-family:var(--display);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  border-radius:999px;padding:5px 12px;white-space:nowrap}
.road.hb{color:var(--hb);border:1px solid rgba(255,92,122,.45)}
.road.sb{color:var(--sb);border:1px solid rgba(255,157,46,.45)}
td.r{text-align:right}
.none{color:var(--faint);font-style:italic;font-family:var(--serif);margin-top:14px}
.note{color:var(--faint);font-size:13.5px;margin-top:40px;border-top:1px solid var(--line);
  padding-top:18px;line-height:1.7;max-width:70ch}
.note b{color:var(--dim);font-weight:500}
@media (max-width:520px){ .chn{font-size:26px} .cht{font-size:18px} }

/* ---------- the curtain ----------------------------------------------------
   Anybody can reach this address. Nobody who does should be able to tell what
   is behind it. So until the key checks out the page is a curtain and a slot:
   no heading, no explanation, no table, nothing in the source worth reading.
   Green velvet and a little gold, because of what is usually found behind one. */
:root{ --vel-d:#03150f; --vel-m:#0a4530; --vel-l:#17805a; --gold:#d9a441; }
body.shut{overflow:hidden}
.curtain{position:fixed;inset:0;z-index:60;display:grid;place-items:center;
  background:radial-gradient(60% 55% at 50% 44%,#0d2a1f,#03100b 78%)}
.curtain[hidden]{display:none}
/* Velvet, not corduroy: two fold patterns at periods that do not divide into one
   another, so the eye never finds the repeat, plus a slow wash of light across
   the whole drop and a followspot where the slot is. */
.half{position:absolute;top:0;bottom:0;width:52%;
  background:
    linear-gradient(180deg,rgba(0,0,0,.6),transparent 20%,transparent 70%,rgba(0,0,0,.66)),
    repeating-linear-gradient(90deg,
      rgba(0,0,0,.34) 0px, rgba(0,0,0,0) 11px, rgba(255,255,255,.05) 19px,
      rgba(0,0,0,0) 27px, rgba(0,0,0,.34) 37px),
    repeating-linear-gradient(90deg,
      var(--vel-d) 0px, var(--vel-m) 17px, var(--vel-l) 31px, var(--vel-m) 45px, var(--vel-d) 62px);
  box-shadow:0 0 70px 20px rgba(0,0,0,.65);
  transition:transform 1.15s cubic-bezier(.66,.01,.2,1)}
.half.l{left:0}
.half.r{right:0}
/* the followspot, sitting over the velvet and under the slot */
.curtain::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(46% 38% at 50% 50%,rgba(255,238,200,.13),transparent 70%),
             radial-gradient(120% 90% at 50% 50%,transparent 42%,rgba(0,0,0,.55) 100%)}
.curtain.open .half.l{transform:translateX(-104%)}
.curtain.open .half.r{transform:translateX(104%)}
/* the valance across the top, and a thread of gold under it */
.valance{position:absolute;top:0;left:0;right:0;height:13vh;min-height:74px;z-index:2;
  background:
    linear-gradient(180deg,rgba(0,0,0,.5),transparent 60%),
    repeating-linear-gradient(90deg,
      var(--vel-d) 0px, var(--vel-m) 13px, var(--vel-l) 24px, var(--vel-m) 35px, var(--vel-d) 48px);
  border-bottom:1px solid rgba(217,164,65,.5);
  box-shadow:0 8px 26px rgba(0,0,0,.55);
  transition:transform 1.15s cubic-bezier(.66,.01,.2,1)}
/* a gold fringe hanging off it */
.valance::after{content:"";position:absolute;left:0;right:0;top:100%;height:9px;
  background:repeating-radial-gradient(circle at 5px 0,
    rgba(217,164,65,.75) 0 1.6px, rgba(217,164,65,0) 1.6px 5px);
  background-size:10px 9px;opacity:.85}
.curtain.open .valance{transform:translateY(-108%)}
/* the slot itself: a brass plate, and not a word on it */
.slot{position:relative;z-index:3;display:flex;align-items:center;gap:10px;
  padding:14px 16px;border-radius:14px;
  background:linear-gradient(180deg,rgba(9,40,28,.92),rgba(3,18,13,.94));
  border:1px solid rgba(217,164,65,.42);
  box-shadow:0 20px 60px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.06);
  transition:transform .35s ease, opacity .5s ease}
.curtain.open .slot{opacity:0;transform:scale(.94)}
.slot input{flex:0 1 210px;background:rgba(0,0,0,.42);border:1px solid rgba(217,164,65,.3);
  border-radius:9px;color:#f2e6c9;padding:11px 13px;font-size:15px;letter-spacing:.14em}
.slot input:focus{outline:2px solid var(--gold);outline-offset:2px}
.slot button{background:none;border:1px solid rgba(217,164,65,.55);color:var(--gold);
  border-radius:999px;padding:10px 12px;line-height:0}
.slot button:hover{background:rgba(217,164,65,.12);border-color:var(--gold)}
.slot svg{width:17px;height:17px;display:block}
.keyhole{width:26px;height:26px;flex:0 0 auto}
/* a wrong key: the curtain shivers and says nothing useful */
@keyframes shiver{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-7px)}
  45%{transform:translateX(6px)} 70%{transform:translateX(-3px)} }
.slot.no{animation:shiver .42s ease}
.slot.no input{border-color:rgba(255,92,122,.7)}
.nope{position:absolute;z-index:3;margin-top:118px;font-family:var(--serif);font-style:italic;
  color:rgba(242,230,201,.62);font-size:14.5px}
.nope[hidden]{display:none}
@media (prefers-reduced-motion:reduce){
  .half,.valance,.slot{transition:opacity .4s ease}
  .curtain.open .half,.curtain.open .valance{transform:none;opacity:0}
  .slot.no{animation:none}
}
</style>
</head>
<body class="shut">

<!-- There is deliberately nothing below but the curtain. Everything else is built
     after the key is accepted, and every word of it is sent from the server at
     that moment, so this file gives up nothing to anyone reading its source. -->
<div class="curtain" id="curtain">
  <div class="half l"></div>
  <div class="half r"></div>
  <div class="valance"></div>

  <div class="slot" id="slot">
    <svg class="keyhole" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="#d9a441" d="M12 2.6a6 6 0 0 0-2.9 11.25L7.4 21.4h9.2l-1.7-7.55A6 6 0 0 0 12 2.6Z"
            opacity=".9"/>
      <circle cx="12" cy="8.6" r="2.5" fill="#062018"/>
      <path fill="#062018" d="M10.9 10.7h2.2l1.1 8.2h-4.4z"/>
    </svg>
    <input id="key" type="password" autocomplete="off" spellcheck="false" aria-label="Key">
    <button type="button" id="go" aria-label="Open">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h13M12 5l7 7-7 7"/>
      </svg>
    </button>
  </div>
  <p class="nope" id="nope" hidden>Not this one.</p>
</div>

<div class="wrap" id="wrap" hidden></div>

<script src="/chapters.js"></script>
<script>
(function () {
  var F = window.FF;
  var esc = (F && F.esc) || function (t) { return String(t).replace(/[&<"]/g, ''); };

  var curtain = document.getElementById('curtain'), slot = document.getElementById('slot');
  var nope = document.getElementById('nope'), wrap = document.getElementById('wrap');
  var opened = false;

  /* The room is put together here rather than written into the page, so that the
     file itself carries no heading, no table and no explanation. It stays hidden
     until the counter has accepted a key. */
  wrap.innerHTML =
    '<header class="mast">' +
      '<a class="brand" href="/">&larr; The Illiterate Writer&rsquo;s Film Forum</a>' +
      '<span class="priv" id="badge"></span>' +
    '</header>' +
    '<h1 id="head"></h1>' +
    '<p class="stand" id="stand"></p>' +
    '<div class="keybox" id="keybox" hidden>' +
      '<label for="key2">Your key</label>' +
      '<div class="row"><input id="key2" type="password" autocomplete="off">' +
      '<button type="button" id="go2">Open</button></div>' +
      '<p class="err" id="err" hidden></p>' +
    '</div>' +
    '<div id="out"></div>' +
    '<p class="note" id="note"></p>';

  var out = document.getElementById('out'), err = document.getElementById('err');
  var box = document.getElementById('keybox');
  var stand = document.getElementById('stand'), note = document.getElementById('note');
  var head = document.getElementById('head'), badge = document.getElementById('badge');

  /* The curtain parts only once, and only on a key the counter has accepted —
     never on the strength of something remembered in this browser. */
  function part() {
    if (opened) return;
    opened = true;
    wrap.hidden = false;
    curtain.classList.add('open');
    setTimeout(function () {
      curtain.hidden = true;
      document.body.classList.remove('shut');
    }, 1250);
  }

  /* and what it says about itself arrives with the room, not with the page */
  function dress(d) {
    if (!d) return;
    if (d.title) document.title = d.title;
    if (d.heading && !head.textContent) head.textContent = d.heading;
    if (d.badge && !badge.textContent) badge.textContent = d.badge;
    if (d.intro && !stand.textContent) stand.textContent = d.intro;
    if (d.notes && d.notes.length && !note.innerHTML) {
      note.innerHTML = d.notes.join('<br><br>');
    }
  }

  function refuse() {
    slot.classList.remove('no');
    void slot.offsetWidth;                 /* restart the shiver */
    slot.classList.add('no');
    nope.hidden = false;
    var i = document.getElementById('key');
    if (i) { i.value = ''; i.focus(); }
  }

  function saved() { try { return localStorage.getItem('ff-key') || ''; } catch (e) { return ''; } }
  function save(k) { try { localStorage.setItem('ff-key', k); } catch (e) {} }
  function forget() { try { localStorage.removeItem('ff-key'); } catch (e) {} }

  function pct(n) { return Math.round(n) + '%'; }

  /* When a vote was cast, in forum time, so the order on screen is the order it
     happened in. Votes stored before the hour was recorded have nothing to show. */
  function when(at) {
    if (!at) return 'before votes were timed';
    try {
      return new Date(at).toLocaleString('en-US', {
        timeZone: 'America/Los_Angeles', weekday: 'short', month: 'short',
        day: 'numeric', hour: 'numeric', minute: '2-digit',
      }).replace(/,/g, '').replace(' AM', 'am').replace(' PM', 'pm');
    } catch (e) { return ''; }
  }

  function chapterOf(n) {
    if (!F) return null;
    for (var i = 0; i < F.CHAPTERS.length; i++) if (F.CHAPTERS[i].n === n) return F.CHAPTERS[i];
    return null;
  }

  function block(n, d) {
    var c = chapterOf(n);
    var title = c ? c.title : 'Chapter ' + n;
    var hb = c && c.ballot ? c.ballot.hb[0] : 'Hollywood Blvd.';
    var sb = c && c.ballot ? c.ballot.sb[0] : 'Sunset Blvd.';
    var h = '<section class="ch"><div class="chh"><span class="chn">' + n + '</span>' +
      '<span class="cht">' + esc(title) + '</span>' +
      '<span class="state ' + d.state + '">' + (d.state === 'open' ? 'Voting open'
        : d.state === 'closed' ? 'Closed' : 'Not open yet') + '</span></div>';

    /* the panel belongs to the week, not to the votes: it shows on an open
       ballot even before anybody has voted, with nothing to agree to yet */
    if (!d.cast) {
      h += '<p class="none">Nobody has voted yet.</p>' + callBox(n, d, hb, sb) + '</section>';
      return h;
    }

    h += '<div class="bars"><span class="bar">' +
         '<i class="h" style="width:' + d.split.hb + '%"></i>' +
         '<i class="s" style="width:' + d.split.sb + '%"></i></span>' +
         '<span class="count"><b>' + d.cast + '</b> ' + (d.cast === 1 ? 'vote' : 'votes') +
         ' &middot; ' + pct(d.split.hb) + ' ' + esc(hb) + ' &middot; ' +
         pct(d.split.sb) + ' ' + esc(sb) + '</span></div>';
    if (d.broke) h += '<p class="broke">A dead heat &mdash; ' + esc(d.broke) + '.</p>';
    var gone = d.roster.filter(function (r) { return r.superseded; }).length;
    if (gone) h += '<p class="broke">You are in the room ' + (gone + 1) + ' times, under ' +
      (gone + 1) + ' spellings. Only the most recent counts &mdash; the older ' +
      (gone === 1 ? 'one is' : 'ones are') + ' set aside below.</p>';

    var hush = d.roster.filter(function (r) { return r.silenced; }).length;
    if (hush) h += '<p class="broke">' + hush + (hush === 1 ? ' vote is' : ' votes are') +
      ' silenced by hand and ' + (hush === 1 ? 'is' : 'are') +
      ' not in the count above. Nothing has been deleted.</p>';

    var again = d.roster.filter(function (r) { return r.revoted; }).length;
    if (again) h += '<p class="broke">' + (again === 1 ? 'A name you silenced has' :
      again + ' names you silenced have') + ' voted again since. The newer vote counts &mdash;' +
      ' silence it again if it is still the same person twice.</p>';

    h += '<table><thead><tr><th>Member &middot; newest vote first</th>' +
         '<th style="text-align:right">Their pick</th><th></th></tr></thead><tbody>';
    d.roster.forEach(function (r) {
      var cls = r.superseded ? ' class="gone"' : r.silenced ? ' class="hush"' : '';
      h += '<tr' + cls + '><td class="nm">' + esc(r.name) +
           (r.chair ? '<span class="chairtag">Chair</span>' : '') +
           (r.superseded ? '<span class="gonetag">Superseded</span>' : '') +
           (r.silenced ? '<span class="hushtag">Silenced</span>' : '') +
           (r.revoted ? '<span class="againtag">Voted again</span>' : '') +
           '<span class="when">' + when(r.at) + '</span>' +
           '</td><td class="r"><span class="road ' + r.road + '">' +
           esc(r.road === 'hb' ? hb : sb) + '</span></td><td class="act">' +
           (r.superseded
             ? '<button type="button" class="hushbtn" disabled ' +
               'title="Already out of the count \u2014 an older spelling of your own name">' +
               'Out already</button>'
             : '<button type="button" class="hushbtn' + (r.silenced ? ' back' : '') +
               '" data-ch="' + n + '" data-name="' + esc(r.name) + '" data-on="' +
               (r.silenced ? '0' : '1') + '">' +
               (r.silenced ? 'Count it' : 'Silence') + '</button>') +
           '</td></tr>';
    });
    h += '</tbody></table>' + callBox(n, d, hb, sb) + '</section>';
    return h;
  }

  /* How the room stands this second, said in one sentence, so the warning he is
     asked to agree to contains the actual result rather than an abstraction. */
  function standing(d, hb, sb) {
    if (!d.cast) return 'Nobody has voted yet.';
    var w = d.winner === 'hb' ? hb : sb;
    var share = d.winner === 'hb' ? d.split.hb : d.split.sb;
    return '<b>' + esc(w) + '</b> takes it, ' + share + '&ndash;' + (100 - share) +
           ', on ' + d.cast + (d.cast === 1 ? ' vote' : ' votes') +
           (d.broke ? ' &mdash; a dead heat, ' + esc(d.broke) : '') + '.';
  }

  /* Ending a ballot before its Sunday.
   *
   * Two taps, never one, and the second tap is asked for underneath a sentence
   * naming the film that is about to win. The result shown here is the result
   * that gets posted — it is the same count, from the same server, a second
   * earlier — so there is no gap between what he agrees to and what the room
   * sees. Nothing is frozen: silencing a vote afterwards still moves it. */
  function callBox(n, d, hb, sb) {
    var early = d.called && d.called.at;

    if (early) {
      return '<div class="call done" id="call' + n + '">' +
        '<p class="callnote">Called early on <b>' + when(Date.parse(d.called.at)) + '</b>. ' +
        'Voting is shut and the result is on the site. ' + standing(d, hb, sb) + '</p>' +
        '<div class="offer"><button type="button" class="callbtn back" data-call="' + n +
          '" data-act="ask">Reopen voting</button></div>' +
        '<div class="ask" hidden><span class="warn">Are you sure?</span>' +
        '<p class="callnote">Reopening takes the result back off the site and lets the room ' +
        'vote again until Sunday. Anyone who already saw the winner will have seen it.</p>' +
        '<div class="btns">' +
          '<button type="button" class="callbtn yes" data-call="' + n + '" data-on="0">' +
            'Yes &mdash; reopen it</button>' +
          '<button type="button" class="callbtn no" data-call="' + n + '" data-act="never">' +
            'Leave it called</button>' +
        '</div></div></div>';
    }

    if (d.state !== 'open') return '';       /* the calendar has it; nothing to skip */

    return '<div class="call" id="call' + n + '">' +
      '<p class="callnote">This ballot runs until Sunday. You can end it now instead.</p>' +
      '<div class="offer"><button type="button" class="callbtn" data-call="' + n +
        '" data-act="ask">Call it now</button></div>' +
      '<div class="ask" hidden><span class="warn">Are you sure?</span>' +
      '<p class="callnote"><span class="big">' + standing(d, hb, sb) + '</span>' +
      (d.cast
        ? 'Calling it now ends the vote for everyone and puts that result on the site ' +
          'immediately. Anybody who has not voted yet loses their chance. You can reopen ' +
          'it afterwards, but not unsee it.'
        : 'There is nothing to call yet. A ballot with no votes in it has no result to ' +
          'post, so this waits until somebody has voted.') + '</p>' +
      '<div class="btns">' +
        '<button type="button" class="callbtn yes" data-call="' + n + '" data-on="1"' +
          (d.cast ? '' : ' disabled title="Nobody has voted"') + '>' +
          'Yes &mdash; call it and post</button>' +
        '<button type="button" class="callbtn no" data-call="' + n + '" data-act="never">' +
          'Keep it open</button>' +
      '</div></div></div>';
  }

  /* the key in use, so a Silence tap does not have to be handed it again */
  var theKey = '';

  /* One listener, set up once: the rows are rewritten on every refresh, so
     nothing is bound to a button that is about to be thrown away. */
  out.addEventListener('click', function (e) {
    if (!e.target.closest) return;

    /* the two taps of calling a ballot early */
    var c = e.target.closest('button.callbtn');
    if (c && !c.disabled) {
      var n = c.getAttribute('data-call');
      var host = document.getElementById('call' + n);
      var act = c.getAttribute('data-act');
      if (act === 'ask' || act === 'never') {
        var asking = act === 'ask';
        host.querySelector('.ask').hidden = !asking;
        host.querySelector('.offer').hidden = asking;
        return;
      }
      var on = c.getAttribute('data-on') === '1';
      Array.prototype.forEach.call(host.querySelectorAll('button'), function (x) { x.disabled = true; });
      c.textContent = on ? 'Calling it…' : 'Reopening…';
      fetch('/api/ballot', {
        method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ chapter: n, call: on, key: theKey }),
      }).then(function (r) { return r.json(); }).then(function (d) {
        if (d && d.error) throw new Error(d.error);
        load(theKey);
      }).catch(function (x) {
        Array.prototype.forEach.call(host.querySelectorAll('button'), function (y) { y.disabled = false; });
        c.textContent = on ? 'Yes — call it and post' : 'Yes — reopen it';
        err.textContent = 'That did not save: ' + ((x && x.message) || 'no answer from the counter') +
          '. The ballot is unchanged.';
        err.hidden = false;
        box.hidden = false;
      });
      return;
    }

    var b = e.target.closest('button.hushbtn');
    if (!b || b.disabled || !b.getAttribute('data-name')) return;
    var on = b.getAttribute('data-on') === '1';
    b.disabled = true;
    b.textContent = on ? 'Silencing\u2026' : 'Counting\u2026';
    fetch('/api/ballot', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        chapter: b.getAttribute('data-ch'),
        silence: b.getAttribute('data-name'),
        on: on,
        key: theKey,
      }),
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d && d.error) throw new Error(d.error);
      load(theKey);                 /* recount from the server, never from here */
    }).catch(function (x) {
      b.disabled = false;
      b.textContent = on ? 'Silence' : 'Count it';
      var why = (x && x.message) || '';
      /* the error line lives in the key box, so the box comes back with it */
      err.textContent = why === 'no'
        ? 'The key has stopped working \u2014 type it again.'
        : 'That did not save: ' + (why || 'no answer from the counter') + '. The vote is unchanged.';
      err.hidden = false;
      box.hidden = false;
    });
  });

  function load(key) {
    if (!F) { refuse(); return; }
    theKey = key;
    err.hidden = true;
    nope.hidden = true;
    out.innerHTML = '<p class="none">Counting&hellip;</p>';
    var jobs = F.CHAPTERS.filter(function (c) { return !!c.ballot; }).map(function (c) {
      return fetch('/api/ballot?chapter=' + c.n + '&key=' + encodeURIComponent(key))
        .then(function (r) {
          if (r.status === 403) throw new Error('key');
          return r.json();
        })
        .then(function (d) { return { n: c.n, d: d }; });
    });
    Promise.all(jobs).then(function (all) {
      save(key);
      box.hidden = true;
      all.forEach(function (x) { dress(x.d); });
      part();
      var any = all.filter(function (x) { return x.d && x.d.state !== 'soon'; });
      out.innerHTML = (any.length ? any.map(function (x) { return block(x.n, x.d); }).join('')
                                  : '<p class="none">No ballot has opened yet.</p>') +
        '<p style="margin-top:28px"><button type="button" class="quiet" id="again">Refresh</button> ' +
        '<button type="button" class="quiet" id="out2">Forget the key on this device</button></p>';
      document.getElementById('again').addEventListener('click', function () { load(key); });
      document.getElementById('out2').addEventListener('click', function () {
        forget(); location.reload();
      });
    }).catch(function (e) {
      out.innerHTML = '';
      /* still behind the curtain: say nothing, shiver, and let him try again.
         Once through, the key box is the place an error belongs. */
      if (!opened) {
        if (e && e.message === 'key') forget();
        refuse();
        return;
      }
      box.hidden = false;
      err.textContent = e && e.message === 'key'
        ? 'That key has stopped working — type it again.'
        : 'Could not reach the counter. Is the site deployed?';
      err.hidden = false;
    });
  }

  function tryKey(el) {
    var k = el && el.value.trim();
    if (k) load(k);
  }
  function wire(inputId, buttonId) {
    var i = document.getElementById(inputId), b = document.getElementById(buttonId);
    if (!i || !b) return;
    b.addEventListener('click', function () { tryKey(i); });
    i.addEventListener('keydown', function (e) { if (e.key === 'Enter') tryKey(i); });
  }
  wire('key', 'go');       /* the slot in the curtain */
  wire('key2', 'go2');     /* and the box inside, if the key ever stops working */

  /* A key remembered in this browser is tried against the counter like any
     other. It opens nothing by itself. */
  var k0 = saved();
  if (k0) load(k0);
  else document.getElementById('key').focus();
})();
</script>
</body>
</html>
